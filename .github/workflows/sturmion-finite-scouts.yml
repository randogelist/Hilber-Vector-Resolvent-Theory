name: STURMION bounded finite witness scouts

on:
  push:
    branches:
      - scout/sturmion-finite-witness-20261107
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-xi-scouts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install fixed numerical dependency
        run: python3 -m pip install --disable-pip-version-check --user mpmath==1.3.0
      - name: Run actual-xi scouts N=2,4,8 and rational quadratic controls
        run: |
          set -euo pipefail
          mkdir -p ci-results
          python3 ci/sturmion_finite_scouts.py --output ci-results/sturmion-finite-scouts.json 2>&1 | tee ci-results/scouts.log
      - name: Upload finite scout observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sturmion-finite-scouts-${{ github.sha }}
          path: ci-results/
          if-no-files-found: warn

  lean-boolean-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Lean 4.33.0 without Lake builds
        run: |
          set -euo pipefail
          d="$(mktemp -d)"
          curl --fail --location --retry 3 \
            https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output "$d/elan.tar.gz"
          tar -xzf "$d/elan.tar.gz" -C "$d"
          "$d/elan-init" -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      - name: Compile and audit finite Boolean acceptance controls
        run: |
          set -euo pipefail
          mkdir -p ci-results
          lean --version | tee ci-results/lean-version.txt
          cp ci/STURMIONFiniteControls.lean.source "$RUNNER_TEMP/STURMIONFiniteControls.lean"
          lean "$RUNNER_TEMP/STURMIONFiniteControls.lean" 2>&1 | tee ci-results/finite-lean-audit.log
          test "$(grep -c 'depends on axioms:' ci-results/finite-lean-audit.log)" -eq 2
          if grep -E 'sorryAx' ci-results/finite-lean-audit.log || (grep -E 'depends on axioms:' ci-results/finite-lean-audit.log | grep -Ev 'axioms: \[(propext|Classical.choice|Quot.sound)(, (propext|Classical.choice|Quot.sound))*\]
            echo "LEAN_SCOUT_AUDIT=REQUIRES_REVIEW" >&2
            exit 1
          fi
          echo "LEAN_SCOUT_BOOLEAN_CONTROLS=PASS" | tee ci-results/lean-scout-result.txt
          echo "ACTUAL_XI_CALIBRATION=NOT_PROVED" | tee -a ci-results/lean-scout-result.txt
      - name: Upload Boolean proof audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sturmion-boolean-control-${{ github.sha }}
          path: ci-results/
          if-no-files-found: warn
); then
            echo "LEAN_SCOUT_AUDIT=REQUIRES_REVIEW" >&2
            exit 1
          fi
          echo "LEAN_SCOUT_BOOLEAN_CONTROLS=PASS" | tee ci-results/lean-scout-result.txt
          echo "ACTUAL_XI_CALIBRATION=NOT_PROVED" | tee -a ci-results/lean-scout-result.txt
      - name: Upload Boolean proof audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sturmion-boolean-control-${{ github.sha }}
          path: ci-results/
          if-no-files-found: warn
